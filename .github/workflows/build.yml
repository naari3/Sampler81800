name: build

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 当面 Windows のみ。macOS は REAPER SDK が WDL/swell を要求するため未対応。
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Web UI は WebView2 を静的リンクする（JUCE の FindWebView2 が NuGet フォルダを見る）
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser `
            -RequiredVersion 1.0.3485.44 -Source nuget.org -Force | Out-Null

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j 4

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
