name: release

# タグ v* を push すると各OSでビルドし、成果物(VST3)を zip にして
# そのタグの GitHub Release に添付する。手動(workflow_dispatch)ではビルドのみ。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # Release への書き込み(添付)に必要

jobs:
  release:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 当面 Windows のみ。macOS は REAPER SDK が WDL/swell を要求するため未対応（同梱後に追加予定）。
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Web UI は WebView2 を静的リンクする。JUCE の FindWebView2 は
      # ユーザーの NuGet パッケージフォルダを見るので、ランナーにも入れておく。
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser `
            -RequiredVersion 1.0.3485.44 -Source nuget.org -Force | Out-Null

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j 4

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # VST3 はビルド構成(単一/複数)で出力パスが変わるので find で探して zip 化する。
      # cmake -E tar は Windows/macOS 共通で zip を作れる。
      - name: Package VST3
        shell: bash
        run: |
          set -e
          VST3=$(find build -type d -name 'OtoMadSampler.vst3' | head -1)
          if [ -z "$VST3" ]; then echo "VST3 not found"; exit 1; fi
          echo "found: $VST3"
          OUT="$GITHUB_WORKSPACE/OtoMadSampler-${{ runner.os }}.zip"
          ( cd "$(dirname "$VST3")" && cmake -E tar cfv "$OUT" --format=zip "OtoMadSampler.vst3" )
          echo "packaged: $OUT"

      # インストーラー。Inno Setup は windows ランナーに同梱されている。
      # zip も残す: 手動で置きたい人と、SmartScreen の警告を避けたい人のため
      # （.vst3 は DAW が読むだけなので SmartScreen の対象外だが、.exe は対象になる）。
      - name: Build installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          VST3=$(find build -type d -name 'OtoMadSampler.vst3' | head -1)
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "$GITHUB_REF_NAME" ] && VER="0.0.0"   # タグ以外(workflow_dispatch)では仮の版
          # ランナー標準で入っているが、イメージが変わって消えても落ちないようにする
          ISCC=$(find /c/Program\ Files* -maxdepth 3 -name ISCC.exe 2>/dev/null | head -1)
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            ISCC=$(find /c/Program\ Files* -maxdepth 3 -name ISCC.exe 2>/dev/null | head -1)
          fi
          [ -n "$ISCC" ] || { echo "ISCC.exe not found"; exit 1; }
          "$ISCC" //DAppVersion="$VER" //DVst3Dir="$(cygpath -w "$(dirname "$VST3")")" installer/OtoMadSampler.iss
          ls -l dist/

      # 署名は証明書があるときだけ。無いリポジトリ/フォークでも落とさない。
      # 2023年6月以降 OV 証明書の鍵はハードウェア(HSM/トークン)必須なので、
      # ここは「クラウド署名サービスの署名ステップを差し込む場所」として空けてある。
      # 証明書を用意したら、この step をそのサービスの action に置き換える。
      - name: Sign installer (skipped without a certificate)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_SIGNING_CONFIGURED }}" ]; then
            echo "署名用のシークレットが無いので未署名のまま配布します。"
            echo "SmartScreen の回避手順は README を参照。"
            exit 0
          fi
          echo "署名ステップが未実装です。証明書サービスの action をここに入れてください。"
          exit 1

      # 毎回リリースノートの先頭に導入手順を入れる。文面は .github/release-body.md。
      # generate_release_notes と併用すると、GitHub が自動生成した変更履歴を
      # この本文の**後ろ**に足してくれる。
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OtoMadSampler-${{ runner.os }}.zip
            dist/*.exe
          body_path: .github/release-body.md
          generate_release_notes: true
